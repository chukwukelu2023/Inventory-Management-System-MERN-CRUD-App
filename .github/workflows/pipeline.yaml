name: Deploy Docker Image

on:
  push:
    branches:
      - dockerfiles
jobs:
  build_image_backend:
    uses: chukwukelu2023/automation-hub/.github/workflows/image_build_ghcr.yaml@main
    with:
      context-path: ./Backend
      tag-name: ghcr.io/chukwukelu2023/backend-app:${{ github.run_number }}
    secrets:
       GHCR_PAT: ${{ secrets.GHCR_PAT }}
       REPO_OWNER: ${{ github.repository_owner }}
  build_image_frontend:
    uses: chukwukelu2023/automation-hub/.github/workflows/image_build_ghcr.yaml@main
    with:
      context-path: ./Frontend/inventory_management_system
      tag-name: ghcr.io/chukwukelu2023/frontend-app:${{ github.run_number }}
    secrets:
       GHCR_PAT: ${{ secrets.GHCR_PAT }}
       REPO_OWNER: ${{ github.repository_owner }}

